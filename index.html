<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Point Cloud Network Lab</title>
<style>
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#05090c;
  }
  point-cloud-network{
    position:fixed;
    inset:0;
    height:auto;
  }
  .macros{
    position:fixed;
    top:14px;
    right:14px;
    display:flex;
    gap:7px;
    align-items:center;
    padding:8px 10px;
    border:1px solid #26323c;
    border-radius:12px;
    background:#0c1218e8;
    backdrop-filter:blur(14px);
    z-index:10;
    color:#94a7b2;
    font:700 10px/1 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .macros[hidden]{display:none}
  .macros button{
    border:1px solid #2c3b45;
    background:#111a20;
    color:#dfe9ee;
    border-radius:8px;
    padding:7px 10px;
    font:11px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    cursor:pointer;
  }
  .macros button:hover{background:#17242c}
  .macros button[aria-pressed="true"]{
    border-color:#257b58;
    background:#123526;
  }
</style>
</head>
<body>
<point-cloud-network id="lab" controls hud></point-cloud-network>
<div class="macros" id="macros">Macros</div>

<script src="point-cloud-network.js"></script>
<script src="macros.js"></script>
<script>
  const lab = document.getElementById('lab');

  // Machine interface kept from the original single-page version.
  // Examples:
  //   PointCloudLab.setConfig({speed:130, shapeMode:'text', shapeText:'AI', showUI:false})
  //   PointCloudLab.getConfig()
  window.PointCloudLab = {
    getConfig:() => lab.getConfig(),
    setConfig:(cfg, opts) => lab.setConfig(cfg, opts),
    exportConfig:() => lab.exportConfig(),
    showUI:() => lab.setConfig({showUI:true}),
    hideUI:() => lab.setConfig({showUI:false})
  };

  // Optional machine-provided initial configuration:
  // define window.POINT_CLOUD_CONFIG before this script runs.
  if(window.POINT_CLOUD_CONFIG && typeof window.POINT_CLOUD_CONFIG==='object'){
    lab.setConfig(window.POINT_CLOUD_CONFIG);
  }

  // Macro toolbar: one toggle button per macro, one macro running at a time.
  // Start one from the URL with ?macro=clock.
  const macroBar = document.getElementById('macros');
  let running = null;

  function setMacro(name){
    if(running){
      running.instance.stop();
      running.button.setAttribute('aria-pressed','false');
    }
    if(!name || running?.name===name){ running = null; return; }
    const button = macroBar.querySelector(`[data-macro="${name}"]`);
    running = {name, button, instance:PointCloudMacros[name](lab)};
    button.setAttribute('aria-pressed','true');
  }

  for(const [name, macro] of Object.entries(PointCloudMacros)){
    const button = document.createElement('button');
    button.dataset.macro = name;
    button.textContent = macro.label || name;
    button.setAttribute('aria-pressed','false');
    button.addEventListener('click', () => setMacro(name));
    macroBar.append(button);
  }

  const startMacro = new URLSearchParams(location.search).get('macro');
  if(startMacro && PointCloudMacros[startMacro]) setMacro(startMacro);

  // The toolbar shows and hides along with the settings panel.
  const syncMacroBar = () => { macroBar.hidden = !lab.getConfig().showUI; };
  lab.addEventListener('configchange', syncMacroBar);
  syncMacroBar();

  // Press "h" to toggle the settings panel (it has no way back once hidden otherwise).
  addEventListener('keydown', e => {
    const target = e.composedPath()[0];
    if(e.key!=='h' || e.metaKey || e.ctrlKey || e.altKey) return;
    if(target.matches && target.matches('input,textarea,select')) return;
    lab.setConfig({showUI:!lab.getConfig().showUI});
  });
</script>
</body>
</html>
