<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Point Cloud Network Lab</title>
<style>
  :root{
    --panel:#0c1218e8;
    --panel-border:#26323c;
    --text:#dce7ee;
    --muted:#91a2ad;
    --accent:#30b178;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05090c;
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  canvas{
    display:block;
    width:100vw;
    height:100vh;
  }
  #panel{
    position:fixed;
    top:14px;
    left:14px;
    width:min(330px,calc(100vw - 28px));
    max-height:calc(100vh - 28px);
    overflow:auto;
    padding:14px;
    border:1px solid var(--panel-border);
    border-radius:12px;
    background:var(--panel);
    backdrop-filter:blur(14px);
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    z-index:5;
  }
  h1{
    font-size:15px;
    margin:0 0 4px;
    font-weight:700;
  }
  .sub{
    color:var(--muted);
    font-size:11px;
    line-height:1.35;
    margin-bottom:12px;
  }
  .section{
    padding-top:11px;
    margin-top:11px;
    border-top:1px solid #202a32;
  }
  .section:first-of-type{
    border-top:0;
    padding-top:0;
    margin-top:0;
  }
  .section-title{
    text-transform:uppercase;
    letter-spacing:.09em;
    font-size:10px;
    color:#94a7b2;
    margin-bottom:8px;
    font-weight:700;
  }
  .row{
    display:grid;
    grid-template-columns:118px 1fr 48px;
    gap:8px;
    align-items:center;
    min-height:28px;
    margin:4px 0;
  }
  .row label{
    font-size:11px;
    color:#cbd8df;
  }
  input[type="range"]{
    width:100%;
    accent-color:var(--accent);
  }
  input[type="text"],select{
    width:100%;
    min-width:0;
    border:1px solid #2a3842;
    color:var(--text);
    background:#0a1015;
    padding:7px 8px;
    border-radius:7px;
    outline:none;
    font-size:12px;
  }
  input[type="color"]{
    width:100%;
    height:26px;
    border:1px solid #2a3842;
    background:#0a1015;
    border-radius:7px;
    padding:2px;
  }
  .value{
    font-size:10px;
    text-align:right;
    color:#87a0ad;
    font-variant-numeric:tabular-nums;
  }
  .wide{
    grid-template-columns:118px 1fr;
  }
  .toggle{
    display:flex;
    gap:8px;
    align-items:center;
    font-size:11px;
    margin:6px 0;
  }
  .toggle input{accent-color:var(--accent)}
  .buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:9px;
  }
  button{
    border:1px solid #2c3b45;
    background:#111a20;
    color:#dfe9ee;
    border-radius:8px;
    padding:8px 9px;
    font-size:11px;
    cursor:pointer;
  }
  button:hover{background:#17242c}
  button.primary{
    border-color:#257b58;
    background:#123526;
  }
  #hud{
    position:fixed;
    right:12px;
    bottom:10px;
    color:#70818b;
    font-size:10px;
    z-index:3;
    user-select:none;
    pointer-events:none;
  }
  @media(max-width:640px){
    #panel{width:290px}
    .row{grid-template-columns:104px 1fr 42px}
    .wide{grid-template-columns:104px 1fr}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h1>Point Cloud Network Lab</h1>
  <div class="sub">Free-moving particles bounce off the viewport. Shape mode applies a spring force toward generated target positions while preserving the live proximity network.</div>

  <div class="section">
    <div class="section-title">Particles</div>

    <div class="row">
      <label>Point count</label>
      <input id="pointCount" type="range" min="30" max="260" value="105" step="1">
      <span class="value" data-for="pointCount"></span>
    </div>

    <div class="row">
      <label>Speed</label>
      <input id="speed" type="range" min="5" max="220" value="90" step="1">
      <span class="value" data-for="speed"></span>
    </div>

    <div class="row">
      <label>Node size</label>
      <input id="nodeScale" type="range" min="0.4" max="3" value="1" step="0.05">
      <span class="value" data-for="nodeScale"></span>
    </div>

    <div class="row">
      <label>Node opacity</label>
      <input id="nodeOpacity" type="range" min="0.1" max="1" value="0.8" step="0.01">
      <span class="value" data-for="nodeOpacity"></span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Connections</div>

    <div class="row">
      <label>Max distance</label>
      <input id="connectionDistance" type="range" min="40" max="520" value="285" step="1">
      <span class="value" data-for="connectionDistance"></span>
    </div>

    <div class="row">
      <label>Near opacity</label>
      <input id="nearAlpha" type="range" min="0" max="0.8" value="0.34" step="0.01">
      <span class="value" data-for="nearAlpha"></span>
    </div>

    <div class="row">
      <label>Far opacity</label>
      <input id="farAlpha" type="range" min="0" max="0.25" value="0.025" step="0.005">
      <span class="value" data-for="farAlpha"></span>
    </div>

    <div class="row">
      <label>Line width</label>
      <input id="lineWidth" type="range" min="0.2" max="3" value="0.85" step="0.05">
      <span class="value" data-for="lineWidth"></span>
    </div>

    <label class="toggle"><input id="showLines" type="checkbox" checked> Show proximity connections</label>
  </div>

  <div class="section">
    <div class="section-title">Shape / Pattern</div>

    <div class="row wide">
      <label>Mode</label>
      <select id="shapeMode">
        <option value="free">Free / bounce</option>
        <option value="circle">Circle</option>
        <option value="ring">Double ring</option>
        <option value="grid">Grid</option>
        <option value="wave">Wave</option>
        <option value="spiral">Spiral</option>
        <option value="heart">Heart</option>
        <option value="text">Block text</option>
      </select>
    </div>

    <div class="row wide" id="textRow">
      <label>Text</label>
      <input id="shapeText" type="text" value="TEXT" maxlength="24">
    </div>

    <div class="row">
      <label>Shape strength</label>
      <input id="shapeStrength" type="range" min="0" max="10" value="4.5" step="0.1">
      <span class="value" data-for="shapeStrength"></span>
    </div>

    <div class="row">
      <label>Shape damping</label>
      <input id="shapeDamping" type="range" min="0.75" max="0.999" value="0.93" step="0.001">
      <span class="value" data-for="shapeDamping"></span>
    </div>

    <div class="row">
      <label>Shape scale</label>
      <input id="shapeScale" type="range" min="0.25" max="1.35" value="0.78" step="0.01">
      <span class="value" data-for="shapeScale"></span>
    </div>

    <div class="row">
      <label>Target jitter</label>
      <input id="targetJitter" type="range" min="0" max="80" value="8" step="1">
      <span class="value" data-for="targetJitter"></span>
    </div>
    <label class="toggle"><input id="drawBoundary" type="checkbox"> Draw shape boundary</label>
    <label class="toggle"><input id="clipBoundaryConnections" type="checkbox" checked> Prevent connections across boundary</label>

    <div class="buttons">
      <button id="scatter">Scatter</button>
      <button id="regenerate">Regenerate shape</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Appearance</div>

    <div class="row wide">
      <label>Point / line color</label>
      <input id="fgColor" type="color" value="#30b178">
    </div>

    <div class="row wide">
      <label>Background</label>
      <input id="bgColor" type="color" value="#05090c">
    </div>

    <div class="buttons">
      <button id="resetDefaults">Reset defaults</button>
      <button id="randomize" class="primary">Randomize</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">JSON Configuration</div>
    <textarea id="jsonConfig" spellcheck="false" style="width:100%;min-height:165px;resize:vertical;border:1px solid #2a3842;color:#dce7ee;background:#0a1015;padding:8px;border-radius:7px;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></textarea>
    <div class="buttons">
      <button id="applyJson" class="primary">Apply JSON</button>
    </div>
    <div class="buttons">
      <button id="exportJson">Export current settings</button>
      <button id="showUiToggle">Hide UI</button>
    </div>
    <div id="jsonStatus" style="margin-top:7px;min-height:14px;font-size:10px;color:#88a2af"></div>
  </div>
</div>

<div id="hud"></div>


<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const panel = document.getElementById('panel');

  // Shape mask canvas: white = valid interior, black = outside.
  const maskCanvas = document.createElement('canvas');
  const maskCtx = maskCanvas.getContext('2d', {willReadFrequently:true});
  let maskData = null;
  let signedDistance = null;

  // Boundary pixels are precomputed whenever the shape changes.
  // They are drawn only when requested by the UI.
  let boundaryPixels = [];

  let W=0,H=0,DPR=1;
  let nodes=[];
  let interiorSamples=[];
  let lastTime=performance.now();

  const $ = id => document.getElementById(id);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const rand=(a,b)=>a+Math.random()*(b-a);

  const controls = {
    pointCount:$('pointCount'),
    speed:$('speed'),
    nodeScale:$('nodeScale'),
    nodeOpacity:$('nodeOpacity'),
    connectionDistance:$('connectionDistance'),
    nearAlpha:$('nearAlpha'),
    farAlpha:$('farAlpha'),
    lineWidth:$('lineWidth'),
    showLines:$('showLines'),
    shapeMode:$('shapeMode'),
    shapeText:$('shapeText'),
    shapeStrength:$('shapeStrength'),
    shapeDamping:$('shapeDamping'),
    shapeScale:$('shapeScale'),
    targetJitter:$('targetJitter'),    drawBoundary:$('drawBoundary'),
    clipBoundaryConnections:$('clipBoundaryConnections'),
    fgColor:$('fgColor'),
    bgColor:$('bgColor')
  };

  // Shape mode now uses containment rather than fixed target positions.
  // "Shape strength" controls how aggressively outside particles are driven inward.
  // "Shape damping" controls only that inward acquisition phase.
  const defaults = {
    pointCount:105,
    speed:90,
    nodeScale:1,
    nodeOpacity:.8,
    connectionDistance:285,
    nearAlpha:.34,
    farAlpha:.025,
    lineWidth:.85,
    shapeStrength:4.5,
    shapeDamping:.93,
    shapeScale:.96,
    targetJitter:8,
    fgColor:'#30b178',
    bgColor:'#05090c'
  };

  function updateReadouts(){
    document.querySelectorAll('.value[data-for]').forEach(el=>{
      const ctl=controls[el.dataset.for];
      el.textContent=Number(ctl.value).toFixed(
        ctl.step && ctl.step.includes('.') ? Math.min(3,(ctl.step.split('.')[1]||'').length) : 0
      );
    });
  }

  function hexToRgb(hex){
    hex=hex.replace('#','');
    if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
    const n=parseInt(hex,16);
    return [(n>>16)&255,(n>>8)&255,n&255];
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight;
    canvas.width=Math.round(W*DPR);
    canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px';
    canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    maskCanvas.width=W;
    maskCanvas.height=H;

    for(const n of nodes){
      n.x=clamp(n.x,n.r,W-n.r);
      n.y=clamp(n.y,n.r,H-n.r);
    }
    generateShapeMask();
  }

  function randomVelocity(speed){
    const a=rand(0,Math.PI*2);
    return {vx:Math.cos(a)*speed,vy:Math.sin(a)*speed};
  }

  function makeNode(){
    const speed=Number(controls.speed.value);
    const v=randomVelocity(rand(speed*.55,speed*1.2));
    const roll=Math.random();

    let baseR;
    if(roll<.12) baseR=rand(3.3,5.4);
    else if(roll<.30) baseR=rand(2.0,3.2);
    else baseR=rand(.9,1.9);

    return {
      x:rand(10,Math.max(11,W-10)),
      y:rand(10,Math.max(11,H-10)),
      vx:v.vx, vy:v.vy,
      baseR,
      r:baseR*Number(controls.nodeScale.value),
      alpha:rand(.55,1),
      phase:rand(0,Math.PI*2),
      acquisitionTarget:null
    };
  }

  function setPointCount(count){
    count=Number(count);
    while(nodes.length<count) nodes.push(makeNode());
    if(nodes.length>count) nodes.length=count;
    assignAcquisitionTargets();
  }

  function renormalizeSpeeds(){
    const target=Number(controls.speed.value);
    for(const n of nodes){
      let mag=Math.hypot(n.vx,n.vy);
      if(mag<.01){
        const v=randomVelocity(target);
        n.vx=v.vx; n.vy=v.vy;
      } else {
        const desired=target*rand(.65,1.15);
        n.vx=n.vx/mag*desired;
        n.vy=n.vy/mag*desired;
      }
    }
  }

  function scatter(){
    const speed=Number(controls.speed.value);
    const shaped=controls.shapeMode.value!=='free' && interiorSamples.length;

    for(const n of nodes){
      let p;
      if(shaped){
        p=interiorSamples[Math.floor(Math.random()*interiorSamples.length)];
      }
      n.x=p ? p.x : rand(n.r,Math.max(n.r+1,W-n.r));
      n.y=p ? p.y : rand(n.r,Math.max(n.r+1,H-n.r));
      const v=randomVelocity(rand(speed*.6,speed*1.2));
      n.vx=v.vx; n.vy=v.vy;
    }
  }

  function clearMask(){
    maskCtx.clearRect(0,0,W,H);
    maskCtx.fillStyle='#fff';
    maskCtx.strokeStyle='#fff';
  }

  function drawShapeToMask(mode){
    const scale=Number(controls.shapeScale.value);
    const cx=W/2, cy=H/2;

    // Use almost all available screen real estate.
    const maxW=W*.92*scale;
    const maxH=H*.86*scale;
    const d=Math.min(maxW,maxH);

    maskCtx.save();
    maskCtx.fillStyle='#fff';
    maskCtx.strokeStyle='#fff';
    maskCtx.lineJoin='round';
    maskCtx.lineCap='round';

    if(mode==='circle'){
      maskCtx.beginPath();
      maskCtx.arc(cx,cy,d*.49,0,Math.PI*2);
      maskCtx.fill();
    }

    else if(mode==='ring'){
      // Double ring becomes two broad annular "lanes", each with interior area.
      const outerR=d*.49;
      const outerBand=Math.max(28,d*.12);
      const innerR=d*.25;
      const innerBand=Math.max(24,d*.10);

      maskCtx.lineWidth=outerBand;
      maskCtx.beginPath();
      maskCtx.arc(cx,cy,outerR-outerBand*.55,0,Math.PI*2);
      maskCtx.stroke();

      maskCtx.lineWidth=innerBand;
      maskCtx.beginPath();
      maskCtx.arc(cx,cy,innerR,0,Math.PI*2);
      maskCtx.stroke();
    }

    else if(mode==='grid'){
      // Grid is treated as one large rectangular container, maximizing usable area.
      maskCtx.fillRect(cx-maxW/2,cy-maxH/2,maxW,maxH);
    }

    else if(mode==='wave'){
      // Broad ribbon around a sine wave.
      maskCtx.lineWidth=Math.max(60,maxH*.24);
      maskCtx.beginPath();
      const steps=180;
      for(let i=0;i<=steps;i++){
        const u=i/steps;
        const x=cx-maxW/2+u*maxW;
        const y=cy+Math.sin(u*Math.PI*4)*maxH*.24;
        if(i===0) maskCtx.moveTo(x,y); else maskCtx.lineTo(x,y);
      }
      maskCtx.stroke();
    }

    else if(mode==='spiral'){
      // Thick spiral corridor rather than forcing points onto the line.
      maskCtx.lineWidth=Math.max(52,d*.105);
      maskCtx.beginPath();
      const turns=3.25, steps=300;
      for(let i=0;i<=steps;i++){
        const u=i/steps;
        const a=u*Math.PI*2*turns;
        const r=u*d*.43;
        const x=cx+Math.cos(a)*r;
        const y=cy+Math.sin(a)*r;
        if(i===0) maskCtx.moveTo(x,y); else maskCtx.lineTo(x,y);
      }
      maskCtx.stroke();
    }

    else if(mode==='heart'){
      maskCtx.beginPath();
      const steps=280;
      for(let i=0;i<=steps;i++){
        const t=i/steps*Math.PI*2;
        const hx=16*Math.pow(Math.sin(t),3);
        const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        const x=cx+hx*(maxW/36);
        const y=cy-hy*(maxH/32);
        if(i===0) maskCtx.moveTo(x,y); else maskCtx.lineTo(x,y);
      }
      maskCtx.closePath();
      maskCtx.fill();
    }

    else if(mode==='text'){
      const text=(controls.shapeText.value || 'TEXT').trim() || 'TEXT';

      // Fit block text to nearly the full viewport while keeping a safe border.
      let fontSize=Math.min(H*.66,maxW);
      maskCtx.font=`900 ${fontSize}px Arial Black, Impact, sans-serif`;

      const maxTextW=maxW;
      while(maskCtx.measureText(text).width>maxTextW && fontSize>24){
        fontSize-=4;
        maskCtx.font=`900 ${fontSize}px Arial Black, Impact, sans-serif`;
      }

      // If height is still excessive, cap by available height.
      fontSize=Math.min(fontSize,maxH*.82);
      maskCtx.font=`900 ${fontSize}px Arial Black, Impact, sans-serif`;
      maskCtx.textAlign='center';
      maskCtx.textBaseline='middle';
      maskCtx.fillText(text,cx,cy+fontSize*.03);
    }

    maskCtx.restore();
  }

  function generateShapeMask(){
    interiorSamples=[];
    const mode=controls.shapeMode.value;
    clearMask();

    if(mode==='free'){
      maskData=null;
      signedDistance=null;
      boundaryPixels=[];
      return;
    }

    drawShapeToMask(mode);
    maskData=maskCtx.getImageData(0,0,W,H);
    computeSignedDistanceField();
    buildBoundaryPixels();

    // Sample the valid interior with a coarse grid.
    // These samples are only used to drive outside particles into the shape.
    const step=Math.max(5,Math.floor(Math.sqrt((W*H)/9000)));
    for(let y=step;y<H;y+=step){
      for(let x=step;x<W;x+=step){
        if(isInsideMask(x,y,1)) interiorSamples.push({x,y});
      }
    }

    assignAcquisitionTargets();
  }

  function buildBoundaryPixels(){
    boundaryPixels=[];
    if(!signedDistance) return;

    const stride=2;
    for(let y=1;y<H-1;y+=stride){
      for(let x=1;x<W-1;x+=stride){
        if(Math.abs(sampleSignedDistance(x,y))<1.35){
          boundaryPixels.push({x,y});
        }
      }
    }
  }

  function maskAlpha(x,y){
    if(!maskData) return 255;
    x=Math.round(x); y=Math.round(y);
    if(x<0||x>=W||y<0||y>=H) return 0;
    return maskData.data[(y*W+x)*4+3];
  }

  // Approximate Euclidean distance transform using a two-pass chamfer method.
  // Positive signed distance = inside shape; negative = outside.
  function distanceTransform(seedMask){
    const N=W*H, INF=1e9;
    const d=new Float32Array(N);
    for(let i=0;i<N;i++) d[i]=seedMask[i] ? INF : 0;

    const c1=1, c2=Math.SQRT2;

    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i=y*W+x;
        let v=d[i];
        if(x>0) v=Math.min(v,d[i-1]+c1);
        if(y>0) v=Math.min(v,d[i-W]+c1);
        if(x>0&&y>0) v=Math.min(v,d[i-W-1]+c2);
        if(x<W-1&&y>0) v=Math.min(v,d[i-W+1]+c2);
        d[i]=v;
      }
    }

    for(let y=H-1;y>=0;y--){
      for(let x=W-1;x>=0;x--){
        const i=y*W+x;
        let v=d[i];
        if(x<W-1) v=Math.min(v,d[i+1]+c1);
        if(y<H-1) v=Math.min(v,d[i+W]+c1);
        if(x<W-1&&y<H-1) v=Math.min(v,d[i+W+1]+c2);
        if(x>0&&y<H-1) v=Math.min(v,d[i+W-1]+c2);
        d[i]=v;
      }
    }
    return d;
  }

  function computeSignedDistanceField(){
    const N=W*H;
    const inside=new Uint8Array(N);
    const outside=new Uint8Array(N);

    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        const i=y*W+x;
        const isIn=maskAlpha(x,y)>=128;
        inside[i]=isIn?1:0;
        outside[i]=isIn?0:1;
      }
    }

    const toOutside=distanceTransform(inside);
    const toInside=distanceTransform(outside);

    signedDistance=new Float32Array(N);
    for(let i=0;i<N;i++){
      signedDistance[i]=inside[i] ? toOutside[i] : -toInside[i];
    }
  }

  function sampleSignedDistance(x,y){
    if(!signedDistance) return 1e6;
    x=clamp(x,0,W-1); y=clamp(y,0,H-1);

    const x0=Math.floor(x), y0=Math.floor(y);
    const x1=Math.min(W-1,x0+1), y1=Math.min(H-1,y0+1);
    const tx=x-x0, ty=y-y0;

    const a=signedDistance[y0*W+x0];
    const b=signedDistance[y0*W+x1];
    const c=signedDistance[y1*W+x0];
    const d=signedDistance[y1*W+x1];

    const ab=a+(b-a)*tx;
    const cd=c+(d-c)*tx;
    return ab+(cd-ab)*ty;
  }

  function sdfNormal(x,y){
    const e=2.0;
    const gx=sampleSignedDistance(x+e,y)-sampleSignedDistance(x-e,y);
    const gy=sampleSignedDistance(x,y+e)-sampleSignedDistance(x,y-e);
    const mag=Math.hypot(gx,gy);
    if(mag<1e-6) return null;
    return {x:gx/mag,y:gy/mag}; // inward normal
  }


  function isInsideMask(x,y,r=0){
    if(!signedDistance) return true;
    return sampleSignedDistance(x,y) >= r;
  }

  function assignAcquisitionTargets(){
    if(!interiorSamples.length){
      for(const n of nodes) n.acquisitionTarget=null;
      return;
    }
    for(const n of nodes){
      // Random interior locations spread points throughout the full area,
      // rather than putting them on the outline.
      const p=interiorSamples[Math.floor(Math.random()*interiorSamples.length)];
      n.acquisitionTarget={x:p.x,y:p.y};
    }
  }

  function boundaryNormal(x,y){
    return sdfNormal(x,y);
  }

  function bounceOffMask(n,oldX,oldY){
    // Find the boundary intersection by binary search along the move segment.
    let ax=oldX, ay=oldY;
    let bx=n.x, by=n.y;

    for(let i=0;i<10;i++){
      const mx=(ax+bx)/2, my=(ay+by)/2;
      if(isInsideMask(mx,my,n.r)){
        ax=mx; ay=my;
      } else {
        bx=mx; by=my;
      }
    }

    n.x=ax; n.y=ay;

    let normal=boundaryNormal(n.x,n.y);
    if(!normal){
      // Fallback: reverse if the boundary gradient is ambiguous.
      n.vx*=-1;
      n.vy*=-1;
      return;
    }

    // Gradient normal points inward. Reflect velocity around the boundary normal.
    const dot=n.vx*normal.x+n.vy*normal.y;

    // Only reflect if moving outward.
    if(dot<0){
      n.vx-=2*dot*normal.x;
      n.vy-=2*dot*normal.y;
    } else {
      // Numerical fallback for unusual local mask geometry.
      n.vx*=-1;
      n.vy*=-1;
    }

    // Push inward until the particle has radius clearance from the boundary.
    const clearance=sampleSignedDistance(n.x,n.y);
    const push=Math.max(1,n.r-clearance+1);
    n.x+=normal.x*push;
    n.y+=normal.y*push;
  }

  function update(dt){
    const mode=controls.shapeMode.value;
    const shaped=mode!=='free' && maskData && interiorSamples.length;
    const speed=Number(controls.speed.value);

    for(const n of nodes){
      n.r=n.baseR*Number(controls.nodeScale.value);

      // If outside the requested shape, attract toward an interior location.
      // Once the particle gets inside, the spring turns OFF completely.
      if(shaped && !isInsideMask(n.x,n.y,n.r)){
        if(!n.acquisitionTarget){
          const p=interiorSamples[Math.floor(Math.random()*interiorSamples.length)];
          n.acquisitionTarget={x:p.x,y:p.y};
        }

        const target=n.acquisitionTarget;
        const k=Number(controls.shapeStrength.value);
        n.vx+=(target.x-n.x)*k*dt;
        n.vy+=(target.y-n.y)*k*dt;

        const damping=Math.pow(Number(controls.shapeDamping.value),dt*60);
        n.vx*=damping;
        n.vy*=damping;
      } else {
        // Inside the shape (or free mode): maintain normal particle speed.
        const mag=Math.hypot(n.vx,n.vy) || 1;
        const correction=1+(speed-mag)/Math.max(1,speed)*dt*.9;
        n.vx*=correction;
        n.vy*=correction;
      }

      const oldX=n.x, oldY=n.y;
      n.x+=n.vx*dt;
      n.y+=n.vy*dt;

      if(shaped){
        // Shape boundary replaces screen boundary.
        if(isInsideMask(oldX,oldY,n.r) && !isInsideMask(n.x,n.y,n.r)){
          bounceOffMask(n,oldX,oldY);
        }
      } else {
        // Original full-screen bounce behavior.
        if(n.x-n.r<=0){ n.x=n.r; n.vx=Math.abs(n.vx); }
        else if(n.x+n.r>=W){ n.x=W-n.r; n.vx=-Math.abs(n.vx); }

        if(n.y-n.r<=0){ n.y=n.r; n.vy=Math.abs(n.vy); }
        else if(n.y+n.r>=H){ n.y=H-n.r; n.vy=-Math.abs(n.vy); }
      }
    }
  }

  function connectionStaysInsideShape(a,b){
    // In free mode there is no interior boundary to cross.
    if(!maskData || controls.shapeMode.value==='free') return true;

    const dx=b.x-a.x;
    const dy=b.y-a.y;
    const dist=Math.hypot(dx,dy);

    // Sample along the segment. A step of ~5 px is fine enough to catch
    // narrow concavities / holes in non-convex shapes without being too expensive.
    const steps=Math.max(2,Math.ceil(dist/5));

    for(let s=1;s<steps;s++){
      const t=s/steps;
      const x=a.x+dx*t;
      const y=a.y+dy*t;

      if(sampleSignedDistance(x,y)<0) return false;
    }
    return true;
  }

  function drawBoundary(rgb){
    if(
      !controls.drawBoundary.checked ||
      controls.shapeMode.value==='free' ||
      !boundaryPixels.length
    ) return;

    ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},0.55)`;

    // Precomputed mask-edge pixels provide an accurate outline even for
    // non-convex text, spirals, hearts, and shapes with narrow corridors.
    for(const p of boundaryPixels){
      ctx.fillRect(p.x,p.y,2,2);
    }
  }

  function drawConnections(rgb){
    if(!controls.showLines.checked) return;

    const maxD=Number(controls.connectionDistance.value);
    const nearAlpha=Number(controls.nearAlpha.value);
    const farAlpha=Number(controls.farAlpha.value);

    ctx.lineCap='round';
    ctx.lineWidth=Number(controls.lineWidth.value);

    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];

      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        const dx=a.x-b.x,dy=a.y-b.y;
        const d2=dx*dx+dy*dy;
        if(d2>maxD*maxD) continue;

        const d=Math.sqrt(d2);

        // In a non-convex container, two points can both be inside the shape
        // while the straight line between them exits and re-enters it.
        // Optionally reject those links.
        if(
          controls.clipBoundaryConnections.checked &&
          controls.shapeMode.value!=='free' &&
          !connectionStaysInsideShape(a,b)
        ) continue;

        const t=clamp(d/maxD,0,1);
        const fade=Math.pow(1-t,1.35);

        // Close points = stronger/darker connection.
        // Far points = progressively fainter.
        const alpha=farAlpha+(nearAlpha-farAlpha)*fade;

        ctx.strokeStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.stroke();
      }
    }
  }

  function drawNodes(now,rgb){
    const opacity=Number(controls.nodeOpacity.value);

    for(const n of nodes){
      const pulse=.97+.03*Math.sin(now*.0015+n.phase);
      const r=n.r*pulse;
      const a=n.alpha*opacity;

      if(r>3){
        ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a*.10})`;
        ctx.beginPath();
        ctx.arc(n.x,n.y,r*1.8,0,Math.PI*2);
        ctx.fill();
      }

      ctx.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
      ctx.beginPath();
      ctx.arc(n.x,n.y,r,0,Math.PI*2);
      ctx.fill();
    }
  }

  function draw(now){
    ctx.fillStyle=controls.bgColor.value;
    ctx.fillRect(0,0,W,H);

    const rgb=hexToRgb(controls.fgColor.value);
    drawConnections(rgb);
    drawBoundary(rgb);
    drawNodes(now,rgb);

    hud.textContent=`${nodes.length} points · ${controls.shapeMode.value}${controls.shapeMode.value!=='free'?' · contained':''}`;
  }

  function loop(now){
    const dt=Math.min((now-lastTime)/1000,.033);
    lastTime=now;
    update(dt);
    draw(now);
    requestAnimationFrame(loop);
  }

  function resetDefaults(){
    Object.entries(defaults).forEach(([key,val])=>{
      if(controls[key]) controls[key].value=val;
    });
    controls.showLines.checked=true;
    controls.drawBoundary.checked=false;
    controls.clipBoundaryConnections.checked=true;
    controls.shapeMode.value='free';
    controls.shapeText.value='TEXT';
    setPointCount(defaults.pointCount);
    renormalizeSpeeds();
    generateShapeMask();
    updateReadouts();
  }

  function randomize(){
    controls.pointCount.value=Math.round(rand(70,180));
    controls.speed.value=Math.round(rand(45,150));
    controls.nodeScale.value=rand(.7,1.6).toFixed(2);
    controls.connectionDistance.value=Math.round(rand(150,380));
    controls.nearAlpha.value=rand(.18,.48).toFixed(2);
    controls.farAlpha.value=rand(.005,.05).toFixed(3);
    controls.lineWidth.value=rand(.55,1.25).toFixed(2);
    setPointCount(controls.pointCount.value);
    renormalizeSpeeds();
    generateShapeMask();
    updateReadouts();
  }


  const machineConfig = { showUI:true };

  function readControl(el){
    if(el.type==='checkbox') return el.checked;
    if(el.type==='range') return Number(el.value);
    return el.value;
  }

  function getCurrentConfig(){
    const out={showUI:machineConfig.showUI};
    for(const [key,el] of Object.entries(controls)) out[key]=readControl(el);
    return out;
  }

  function setUiVisible(show){
    machineConfig.showUI=!!show;
    panel.style.display=machineConfig.showUI ? '' : 'none';
    const btn=$('showUiToggle');
    if(btn) btn.textContent=machineConfig.showUI ? 'Hide UI' : 'Show UI';
  }

  function refreshJsonEditor(){
    const el=$('jsonConfig');
    if(el) el.value=JSON.stringify(getCurrentConfig(),null,2);
  }

  function applyConfiguration(cfg, opts={}){
    if(!cfg || typeof cfg!=='object' || Array.isArray(cfg)){
      throw new Error('Configuration must be a JSON object.');
    }

    if(Object.prototype.hasOwnProperty.call(cfg,'showUI')){
      setUiVisible(cfg.showUI);
    }

    for(const [key,value] of Object.entries(cfg)){
      if(key==='showUI') continue;
      const el=controls[key];
      if(!el) continue;

      if(el.type==='checkbox') el.checked=!!value;
      else el.value=value;
    }

    setPointCount(Number(controls.pointCount.value));
    renormalizeSpeeds();
    generateShapeMask();
    updateReadouts();

    if(opts.scatter) scatter();
    if(!opts.skipJsonRefresh) refreshJsonEditor();

    return getCurrentConfig();
  }

  function exportCurrentSettings(){
    const text=JSON.stringify(getCurrentConfig(),null,2);
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='point-cloud-config.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    return text;
  }

  // Machine interface.
  // Examples:
  //   PointCloudLab.setConfig({speed:130, shapeMode:'text', shapeText:'AI', showUI:false})
  //   PointCloudLab.getConfig()
  window.PointCloudLab = {
    getConfig:getCurrentConfig,
    setConfig:applyConfiguration,
    exportConfig:exportCurrentSettings,
    showUI:()=>{ setUiVisible(true); refreshJsonEditor(); },
    hideUI:()=>{ setUiVisible(false); }
  };

  // Keep JSON synchronized immediately whenever any UI control changes.
  function handleControlChange(key, el){
    if(el.type==='checkbox') {
      // value read directly by getCurrentConfig()
    }

    if(key==='pointCount'){
      setPointCount(Number(controls.pointCount.value));
      generateShapeMask();
    }
    else if(key==='speed'){
      renormalizeSpeeds();
    }
    else if(key==='shapeMode' || key==='shapeText' || key==='shapeScale'){
      generateShapeMask();
    }

    updateReadouts();
    refreshJsonEditor();
  }

  for(const [key,el] of Object.entries(controls)){
    const event =
      (el.type==='range' || el.type==='text' || el.type==='color')
      ? 'input'
      : 'change';

    el.addEventListener(event,()=>handleControlChange(key,el));
  }

  $('scatter').addEventListener('click',scatter);
  $('regenerate').addEventListener('click',generateShapeMask);
  $('resetDefaults').addEventListener('click',resetDefaults);
  $('randomize').addEventListener('click',randomize);


  $('applyJson').addEventListener('click',()=>{
    const status=$('jsonStatus');
    try{
      const parsed=JSON.parse($('jsonConfig').value);
      applyConfiguration(parsed,{skipJsonRefresh:true});
      refreshJsonEditor();
      status.style.color='#88a2af';
      status.textContent='Configuration applied.';
    }catch(err){
      status.style.color='#e28a8a';
      status.textContent='Invalid JSON: '+err.message;
    }
  });

  $('exportJson').addEventListener('click',()=>{
    exportCurrentSettings();
    $('jsonStatus').style.color='#88a2af';
    $('jsonStatus').textContent='Current settings exported.';
  });

  $('showUiToggle').addEventListener('click',()=>{
    setUiVisible(!machineConfig.showUI);
    refreshJsonEditor();
  });

  window.addEventListener('resize',resize,{passive:true});

  resize();
  setPointCount(Number(controls.pointCount.value));
  controls.shapeScale.value=defaults.shapeScale;
  updateReadouts();

  // Optional machine-provided initial configuration:
  // define window.POINT_CLOUD_CONFIG before this script runs.
  if(window.POINT_CLOUD_CONFIG && typeof window.POINT_CLOUD_CONFIG==='object'){
    applyConfiguration(window.POINT_CLOUD_CONFIG);
  } else {
    setUiVisible(true);
    refreshJsonEditor();
  }

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
