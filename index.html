<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Point Cloud Network Lab</title>
<style>
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:#05090c;
  }
  point-cloud-network{
    position:fixed;
    inset:0;
    height:auto;
  }
  .macros{
    position:fixed;
    top:14px;
    right:14px;
    display:flex;
    flex-wrap:wrap;
    gap:6px 8px;
    align-items:center;
    max-width:min(260px,calc(100vw - 28px));
    padding:8px 10px;
    border:1px solid #26323c;
    border-radius:12px;
    background:#0c1218e8;
    backdrop-filter:blur(14px);
    z-index:10;
    color:#94a7b2;
    font:700 10px/1 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    letter-spacing:.09em;
    text-transform:uppercase;
  }
  .macros[hidden]{display:none}
  .macros select{
    flex:1;
    min-width:0;
    border:1px solid #2a3842;
    color:#dce7ee;
    background:#0a1015;
    padding:6px 8px;
    border-radius:7px;
    outline:none;
    font:12px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .macros .hint{
    flex-basis:100%;
    color:#87a0ad;
    font-weight:400;
    font-size:10px;
    line-height:1.35;
    letter-spacing:0;
    text-transform:none;
  }
  .macros .hint:empty{display:none}
</style>
</head>
<body>
<point-cloud-network id="lab" controls hud></point-cloud-network>
<div class="macros" id="macros">
  <label for="macroSelect">Macro</label>
  <select id="macroSelect"><option value="">None</option></select>
  <div class="hint" id="macroHint"></div>
</div>

<script src="point-cloud-network.js"></script>
<script src="macros.js"></script>
<script>
  const lab = document.getElementById('lab');

  // Machine interface kept from the original single-page version.
  // Examples:
  //   PointCloudLab.setConfig({speed:130, shapeMode:'text', shapeText:'AI', showUI:false})
  //   PointCloudLab.getConfig()
  window.PointCloudLab = {
    getConfig:() => lab.getConfig(),
    setConfig:(cfg, opts) => lab.setConfig(cfg, opts),
    exportConfig:() => lab.exportConfig(),
    showUI:() => lab.setConfig({showUI:true}),
    hideUI:() => lab.setConfig({showUI:false})
  };

  // Optional machine-provided initial configuration:
  // define window.POINT_CLOUD_CONFIG before this script runs.
  if(window.POINT_CLOUD_CONFIG && typeof window.POINT_CLOUD_CONFIG==='object'){
    lab.setConfig(window.POINT_CLOUD_CONFIG);
  }

  // Macro picker: one macro running at a time. The running macro is kept in
  // the URL (?macro=clock) so a view can be shared or bookmarked.
  const macroBar = document.getElementById('macros');
  const macroSelect = document.getElementById('macroSelect');
  const macroHint = document.getElementById('macroHint');
  let running = null;

  function setMacro(name){
    running?.stop();
    running = null;
    const macro = PointCloudMacros[name];
    if(macro) running = macro(lab, macro.demo);

    macroSelect.value = macro ? name : '';
    macroHint.textContent = macro?.hint || '';
    const url = new URL(location.href);
    if(macro) url.searchParams.set('macro', name);
    else url.searchParams.delete('macro');
    history.replaceState(null, '', url);
  }

  for(const [name, macro] of Object.entries(PointCloudMacros)){
    macroSelect.add(new Option(macro.label || name, name));
  }
  macroSelect.addEventListener('change', () => setMacro(macroSelect.value));

  const startMacro = new URLSearchParams(location.search).get('macro');
  if(startMacro) setMacro(startMacro);

  // The toolbar shows and hides along with the settings panel.
  const syncMacroBar = () => { macroBar.hidden = !lab.getConfig().showUI; };
  lab.addEventListener('configchange', syncMacroBar);
  syncMacroBar();

  // Press "h" to toggle the settings panel (it has no way back once hidden otherwise).
  addEventListener('keydown', e => {
    const target = e.composedPath()[0];
    if(e.key!=='h' || e.metaKey || e.ctrlKey || e.altKey) return;
    if(target.matches && target.matches('input,textarea,select')) return;
    lab.setConfig({showUI:!lab.getConfig().showUI});
  });
</script>
</body>
</html>
